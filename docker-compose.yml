services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: siger-dashboard:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped